
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تلفزيون سبها</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 100vw;
      aspect-ratio: 16 / 9;
      background: #000;
      margin: 0 auto;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-aspect-ratio: 16/9) {
      .player-wrapper {
        width: 100vw;
        height: auto;
      }
    }

    @media (min-aspect-ratio: 16/9) {
      .player-wrapper {
        height: 100vh;
        width: auto;
        max-width: 100%;
      }
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #offline-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #offline-screen img {
      max-width: 75%;
      max-height: 32vh;
      margin-bottom: 25px;
    }

    #offline-screen h1 {
      font-size: 1.7rem;
      margin-bottom: 12px;
      color: #fff;
    }

    #offline-screen p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #ccc;
      max-width: 92%;
    }

    #offline-screen .schedule {
      margin-top: 22px;
      color: #4ade80;
      font-size: 1.05rem;
    }

    #offline-screen.hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- شاشة التوقف -->
  <div id="offline-screen">
    <!-- غيّر الرابط التالي إلى رابط شعار قناتك الحقيقي -->
    <img src="https://via.placeholder.com/400x180/000000/FFFFFF?text=تلفزيون+سبها" alt="تلفزيون سبها">

    <h1>البث متوقف حالياً...</h1>
    <p>ننتظركم في تلفزيون سبها في مواعيد البث الرسمية</p>
    <p class="schedule">مواعيد البث الرسمية : يومياً من السابعة مساء حتى منتصف الليل</p>
  </div>

  <!-- مشغل Kick -->
  <div class="player-wrapper" id="player-container">
    <iframe
      id="kick-player"
      src="https://player.kick.com/sebhatv-ch?autoplay=true"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      frameborder="0"
      scrolling="no">
    </iframe>
  </div>

  <script>
    // ضع هنا رابط شعار قناتك المباشر (PNG أو JPG)
    const LOGO_URL = "https://via.placeholder.com/400x180/000000/FFFFFF?text=تلفزيون+سبها";

    document.querySelector('#offline-screen img').src = LOGO_URL;

    async function checkLiveStatus() {
      try {
        const res = await fetch("https://kick.com/api/v2/channels/sebhatv-ch");
        const data = await res.json();
        const isLive = data?.livestream?.is_live === true;

        const offline = document.getElementById('offline-screen');
        if (isLive) {
          offline.classList.add('hidden');
        } else {
          offline.classList.remove('hidden');
        }
      } catch (e) {
        // لو فشل الكشف نعرض المشغل (Kick يعرض حالته)
        document.getElementById('offline-screen').classList.add('hidden');
      }
    }

    checkLiveStatus();
    setInterval(checkLiveStatus, 45000); // كل 45 ثانية

    // منع التكبير
    document.addEventListener('gesturestart', e => e.preventDefault());
  </script>
</body>
</html>
